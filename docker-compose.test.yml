services:
  web-test:
    build: .
    container_name: bookstore-test
    ports:
      - "5001:5000"
      - "50051:50051"
    volumes:
      - .:/app
    environment:
      - DB_PATH=/app/books_test.db
      - FLASK_ENV=testing
      - PYTHONUNBUFFERED=1
      - INVENTORY_HOST=localhost
      - INVENTORY_PORT=50051
    command: sh -c "cd /app/inventory && python server.py & cd /app && python app.py"
